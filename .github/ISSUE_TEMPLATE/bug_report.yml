name: Bug report
description: Report a problem while editing a screenshot.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove API keys, private URLs and personal screenshot content before posting.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you click or type? What did you expect, and what happened?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and app version or commit
      placeholder: Linux, commit abc1234, compiled desktop app
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or error message
      description: Optional. Include only redacted content. For AI failures, describe the API protocol and model capabilities without credentials or private endpoints.
